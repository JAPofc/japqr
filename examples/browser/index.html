<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>japqr - browser demo</title>
    <!--
      japqr - browser demo
      Serve the repository root (e.g. `npx serve .`) and open this file.

      Copyright (c) 2026 @japofc

      https://github.com/japofc/japqr
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 0.35rem;
        opacity: 0.8;
      }
      input,
      select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        font: inherit;
        border-radius: 8px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: transparent;
        color: inherit;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 0.75rem;
      }
      .preview {
        margin-top: 1.5rem;
        display: grid;
        place-items: center;
        padding: 1rem;
        border-radius: 12px;
        border: 1px solid rgba(127, 127, 127, 0.25);
      }
      .preview svg {
        width: min(320px, 100%);
        height: auto;
      }
      canvas {
        display: none;
      }
      .meta {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        opacity: 0.65;
      }
      @media (prefers-color-scheme: dark) {
        .preview {
          background: #fff;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "japqr": "../dist/esm/index.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>japqr</h1>
    <p>Type something, get a scannable QR code. The SVG is generated in the browser, no server involved.</p>

    <div class="row">
      <div>
        <label for="payload">Payload</label>
        <input id="payload" type="text" value="https://github.com/japofc/japqr" />
      </div>
      <div>
        <label for="ecc">Error correction</label>
        <select id="ecc">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="quartile">Quartile</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="preview" id="preview"></div>
    <p class="meta" id="meta"></p>
    <canvas id="canvas" width="1" height="1"></canvas>

    <p>
      Also works with <code>&lt;canvas&gt;</code>:
      <code>qr.draw(document.querySelector('#canvas'))</code>
    </p>

    <script type="module">
      import { QrCode } from 'japqr';

      const payload = document.querySelector('#payload');
      const ecc = document.querySelector('#ecc');
      const preview = document.querySelector('#preview');
      const meta = document.querySelector('#meta');
      const canvas = document.querySelector('#canvas');

      function render() {
        const text = payload.value || ' ';
        const qr = QrCode.encodeText(text, { ecc: ecc.value });

        preview.innerHTML = qr.toSvgString({ margin: 3, includeXmlDeclaration: false, title: text });
        qr.draw(canvas, { margin: 3, scale: 6 });
        meta.textContent = `version ${qr.version} | ${qr.size} x ${qr.size} modules | ecc ${qr.ecc} | mask ${qr.mask}`;

        // Downloadable data URL, if you ever need it:
        window.__qrDataUrl = qr.toDataUrl();
      }

      payload.addEventListener('input', render);
      ecc.addEventListener('change', render);
      render();
    </script>
  </body>
</html>
