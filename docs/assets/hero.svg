<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" role="img" aria-label="japofc-qr - zero-dependency QR code generator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#131c26"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="566" y="46" width="268" height="268" rx="18"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="360" rx="26" fill="url(#bg)"/>

  <!-- left: brand -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
    <text x="56" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="54" font-weight="800" fill="#f0f6fc" letter-spacing="-2">japofc-qr</text>
    <text x="58" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="18" fill="#8b949e">Zero-dependency QR codes</text>
    <text x="58" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="18" fill="#8b949e">for Node, Bun, Deno &amp; the browser.</text>

    <!-- install chip -->
    <rect x="56" y="196" width="206" height="46" rx="10" fill="#161d26" stroke="#263039"/>
    <text x="74" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="17" fill="#7ee787">npm i japofc-qr</text>

    <!-- feature ticks -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8b949e">
      <circle cx="63" cy="274" r="3.5" fill="#7ee787"/>
      <text x="76" y="279">40 versions · 4 ECC levels · 8 masks</text>
      <circle cx="63" cy="302" r="3.5" fill="#7ee787"/>
      <text x="76" y="307">SVG, terminal, canvas &amp; data URL</text>
      <circle cx="63" cy="330" r="3.5" fill="#7ee787"/>
      <text x="76" y="335">MIT · no runtime dependencies</text>
    </g>
  </g>

  <!-- right: QR card -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.7s" fill="freeze"/>
    <rect x="566" y="46" width="268" height="268" rx="18"
          fill="#ffffff" filter="url(#glow)" opacity="0.18"/>
    <rect x="566" y="46" width="268" height="268" rx="18" fill="#ffffff"/>
    <g transform="translate(586 66) scale(6.9091)">
