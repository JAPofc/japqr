name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Preflight
        run: npm run preflight

      - name: Test
        run: npm run test:only

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce coverage thresholds
        run: npm run coverage

  metadata:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint package.json and exports
        run: npx publint --strict

      - name: Check type resolution for ESM and CJS
        run: npx attw --pack .

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify published files
        run: npm pack --dry-run

      - name: Enforce the browser bundle size budget
        run: |
          SIZE=$(gzip -c dist/browser/japofc-qr.min.js | wc -c)
          LIMIT=12000
          echo "browser bundle: ${SIZE} bytes gzipped (budget ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::browser bundle is ${SIZE} bytes gzipped, over the ${LIMIT} byte budget"
            exit 1
          fi

      - name: Verify the browser bundle ships
        run: npm pack --json | node -e "const files=JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(f=>f.path);const need=files.filter(f=>f.startsWith('dist/browser/'));if(need.length!==2){console.error('browser bundle missing from the tarball');process.exit(1)}console.log('browser bundle:',need.join(', '))"
