name: Stale

# Closes what nobody is waiting for, so an unanswered issue does not become a
# permanent source of guilt.
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 21
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security,dependencies
          remove-stale-when-updated: true
          stale-issue-message: >
            This issue has been quiet for 90 days and is marked as stale.
            It will be closed in 21 days unless there is new activity or the
            `pinned` label is added.
          stale-pr-message: >
            This pull request has been quiet for 90 days and is marked as stale.
            It will be closed in 21 days unless there is new activity or the
            `pinned` label is added.
