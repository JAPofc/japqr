name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `id-token: write` is required to generate npm provenance attestations.
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pre-publish checks
        run: npm run preflight

      - name: Test
        run: npm run test:only

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish (trusted publishing)
        id: publish_oidc
        # Falls through to the token step below when the package has no
        # trusted publisher configured yet, so the release never breaks while
        # the npm settings are being migrated.
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish with token (fallback)
        if: steps.publish_oidc.outcome == 'failure' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the package was published
        if: steps.publish_oidc.outcome == 'failure' && env.NPM_TOKEN == ''
        run: |
          echo "::error::Publish failed and no NPM_TOKEN fallback is configured."
          echo "Add a trusted publisher under https://www.npmjs.com/package/japofc-qr/access"
          echo "(GitHub Actions, owner JAPofc, repository japqr, workflow release.yml)"
          exit 1
